<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mis Gastos"/>
<meta name="theme-color" content="#090909"/>
<title>Mis Gastos 💸</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#090909;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top)+16px) calc(env(safe-area-inset-right)+12px) calc(env(safe-area-inset-bottom)+32px) calc(env(safe-area-inset-left)+12px)}
.app{max-width:600px;margin:0 auto}
/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:19px;font-weight:600;letter-spacing:-.02em}
.mes-badge{font-size:11px;color:#3a3a3a;background:#141414;padding:5px 13px;border-radius:20px;border:1px solid #1e1e1e;font-variant-numeric:tabular-nums}
/* Cards */
.card{background:#111;border-radius:16px;border:1px solid #1e1e1e;padding:14px;margin-bottom:12px}
/* Inputs */
.row{display:flex;gap:8px}
input{background:#1a1a1a;border:1px solid #252525;border-radius:10px;padding:11px 12px;color:#f0f0f0;font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:#333}
.inp-desc{flex:1;min-width:0}
.inp-monto{width:88px;flex-shrink:0;font-variant-numeric:tabular-nums}
.btn-add{background:#f0f0f0;border:none;color:#090909;font-size:13px;font-weight:700;padding:11px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:opacity .15s}
.btn-add:active{opacity:.75}
.btn-add.busy{background:#1e1e1e;color:#444;cursor:default}
/* Category chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid #252525;background:transparent;color:#555;cursor:pointer;font-family:inherit;transition:all .15s;-webkit-appearance:none}
.chip.on{background:rgba(212,168,75,.1);border-color:#d4a84b;color:#d4a84b;font-weight:600}
/* Tabs */
.tabs{display:flex;gap:4px;background:#111;padding:4px;border-radius:13px;border:1px solid #1e1e1e;margin-bottom:14px}
.tab{flex:1;padding:9px 0;border-radius:10px;border:none;font-size:13px;font-weight:400;cursor:pointer;background:transparent;color:#444;font-family:inherit;transition:all .15s}
.tab.on{background:#1e1e1e;color:#f0f0f0;font-weight:600}
/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#111;border-radius:13px;padding:14px 15px;border:1px solid #1e1e1e}
.stat-l{font-size:10px;color:#333;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:#f0f0f0}
.amber{color:#d4a84b}
/* Hist header */
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lbl{font-size:10px;color:#333;text-transform:uppercase;letter-spacing:.08em}
.btn-ghost{font-size:12px;background:transparent;border:1px solid #252525;color:#444;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-ghost:active{opacity:.7}
/* Gasto row */
.gasto{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #161616}
.gasto:last-child{border-bottom:none}
.g-ico{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.g-info{flex:1;min-width:0}
.g-desc{font-size:14px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-meta{font-size:11px;color:#333;margin-top:2px;font-variant-numeric:tabular-nums}
.g-amt{font-size:14px;font-variant-numeric:tabular-nums;color:#ccc;font-weight:500;flex-shrink:0}
.btn-i{background:transparent;border:none;cursor:pointer;color:#2e2e2e;font-size:14px;padding:5px;border-radius:6px;flex-shrink:0;line-height:1}
.btn-i:active{color:#d4a84b}
/* Edit box */
.edit-box{background:#161616;border-radius:13px;border:1px solid #252525;padding:13px;margin:5px 0 8px}
.edit-lbl{font-size:10px;color:#333;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.edit-row{display:flex;gap:8px;margin-bottom:10px}
.edit-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.edit-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{font-size:13px;background:transparent;border:1px solid #252525;color:#555;padding:7px 14px;border-radius:9px;cursor:pointer;font-family:inherit}
.btn-save{font-size:13px;background:#f0f0f0;border:none;color:#090909;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:700;font-family:inherit}
/* Periods */
.periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.per{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid #252525;background:transparent;color:#444;cursor:pointer;font-family:inherit;transition:all .15s;-webkit-appearance:none}
.per.on{background:rgba(212,168,75,.1);border-color:#d4a84b;color:#d4a84b;font-weight:600}
/* Chart */
.chart-wrap{background:#111;border-radius:14px;border:1px solid #1e1e1e;padding:14px;margin-bottom:12px}
/* Cat breakdown */
.cat-wrap{background:#111;border-radius:14px;border:1px solid #1e1e1e;padding:14px 15px}
.cat-item{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-item:last-child{margin-bottom:0}
.cat-n{font-size:13px;color:#ccc;flex:1;min-width:0}
.bar-bg{flex:2;height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden}
.bar-f{height:100%;background:#d4a84b;border-radius:3px;transition:width .4s ease}
.cat-nums{display:flex;flex-direction:column;align-items:flex-end;min-width:68px}
.cat-s{font-size:12px;color:#777;font-variant-numeric:tabular-nums}
.cat-p{font-size:10px;color:#333;font-variant-numeric:tabular-nums}
/* Empty */
.empty{text-align:center;padding:28px 0;color:#272727;font-size:13px;line-height:2}
/* Toast */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom)+20px);left:50%;transform:translateX(-50%) translateY(12px);background:#1e1e1e;border:1px solid #2a2a2a;color:#f0f0f0;font-size:13px;padding:9px 20px;border-radius:20px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:999;box-shadow:0 4px 24px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="logo">Mis Gastos 💸</div>
    <div class="mes-badge" id="mes-lbl"></div>
  </div>

  <div class="card">
    <div class="row">
      <input id="i-desc" class="inp-desc" type="text" placeholder="¿Qué gastaste? (ej: almuerzo)" autocomplete="off" autocorrect="off"/>
      <input id="i-monto" class="inp-monto" type="number" placeholder="S/ 0" min="0" step="0.01" inputmode="decimal"/>
      <button id="btn-add" class="btn-add">+ Agregar</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="setTab('gastos')">Gastos</button>
    <button class="tab" onclick="setTab('resumen')">Resumen</button>
  </div>

  <!-- Tab Gastos -->
  <div id="t-gastos">
    <div class="stats">
      <div class="stat"><div class="stat-l">Este mes</div><div class="stat-v amber" id="st-mes">S/ 0.00</div></div>
      <div class="stat"><div class="stat-l">Total registros</div><div class="stat-v" id="st-n">0</div></div>
    </div>
    <div class="hh"><div class="lbl">Historial</div><button class="btn-ghost" onclick="borrarTodo()">Borrar todo</button></div>
    <div id="hist"></div>
  </div>

  <!-- Tab Resumen -->
  <div id="t-resumen" style="display:none">
    <div class="periods" id="periods"></div>
    <div class="stats">
      <div class="stat"><div class="stat-l">Total gastado</div><div class="stat-v amber" id="r-tot">S/ 0.00</div></div>
      <div class="stat"><div class="stat-l">Transacciones</div><div class="stat-v" id="r-n">0</div></div>
    </div>
    <div class="chart-wrap" id="chart-wrap" style="display:none">
      <div class="lbl" style="margin-bottom:12px">Evolución</div>
      <svg id="chart-svg" style="width:100%;height:90px"></svg>
    </div>
    <div class="cat-wrap">
      <div class="lbl" style="margin-bottom:14px">Por categoría</div>
      <div id="cat-bd"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Data ──────────────────────────────────────────────────────
const KEY = 'mg_v4';
const MS  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MFL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PERIODOS = [{k:'hoy',l:'Hoy'},{k:'semana',l:'7 días'},{k:'mes',l:'Este mes'},{k:'mes_ant',l:'Mes ant.'},{k:'3meses',l:'3 meses'},{k:'todo',l:'Todo'}];
const CATS = [
  ['🍔','Comida'],['☕','Café y snacks'],['🚌','Transporte'],['🎮','Entretenimiento'],
  ['🛒','Mercado'],['💊','Salud'],['📱','Tecnología'],['🏠','Hogar'],
  ['💈','Cuidado personal'],['🐱','Mascotas'],['📚','Educación'],
  ['👗','Ropa'],['🏋️','Deporte'],['💰','Otros'],
];
const KW = {
  'Comida':['almuerzo','cena','desayuno','pollo','pizza','burger','hamburguesa','menú','menu','chifa','sushi','ceviche','lomo','sanguchería','sangucheria','restaurante','comida','pan','tamal','empanada','arroz','tallarín','tallarin','leche','yogurt','queso','huevo','atún','atun'],
  'Café y snacks':['café','cafe','coffee','starbucks','capuchino','latte','té ','te ','chocolate','galleta','snack','donuts','torta','pastel','helado','jugo','limonada','tambo','oxxo','agua','gaseosa','bebida','botella','chips'],
  'Transporte':['uber','cabify','taxi','bus','micro','combi','metropolitano','metro','tren','indriver','beat','pasaje','peaje','gasolina','grifo','combustible','parking','estacionamiento','mecánico','mecanico'],
  'Entretenimiento':['cine','netflix','spotify','youtube','steam','juego','concierto','teatro','evento','bar','karaoke','fiesta','trago','cerveza','ron','pisco','whiskey','club','discoteca','bowling','xbox','playstation','prime','hbo','disney+'],
  'Mercado':['mercado','plaza vea','tottus','vivanda','wong','makro','supermercado','detergente','jabón','jabon','papel','shampoo','azúcar','azucar','aceite','mantequilla','sal','harina'],
  'Salud':['farmacia','inkafarma','mifarma','botica','medicina','pastilla','doctor','médico','medico','consulta','clínica','clinica','hospital','laboratorio','dentista','óptica','optica','lente','vitamina'],
  'Tecnología':['celular','laptop','computadora','cable','cargador','audifono','auricular','mouse','teclado','usb','apple','samsung','xiaomi','huawei','hiraoka','curacao'],
  'Hogar':['alquiler','luz ','agua ','gas ','internet','movistar','claro','entel','bitel','mueble','silla','mesa','cama','colchón','colchon','toalla','limpieza','escoba'],
  'Cuidado personal':['barbería','barberia','peluquería','peluqueria','corte','crema','perfume','desodorante','gel ','maquillaje','masaje','spa','manicure','pedicure','depilación','depilacion'],
  'Mascotas':['veterinaria','veterinario','mascota','arena gato','comida gato','comida perro','collar','correa','vacuna','petshop','mimaskot'],
  'Educación':['libro','libros','curso','clases','instituto','universidad','colegio','matrícula','matricula','mensualidad','platzi','udemy','útiles','utiles','cuaderno'],
  'Ropa':['ropa','camisa','polo ','pantalón','pantalon','jean','vestido','zapato','zapatilla','adidas','nike','puma','saga','ripley','oechsle'],
  'Deporte':['cancha','fulbito','paddle','pádel','padel','squash','natación','natacion','piscina','bicicleta','bici','raqueta'],
};

function guesscat(txt) {
  const t = txt.toLowerCase();
  for (const [cat,kws] of Object.entries(KW)) {
    for (const kw of kws) { if (t.includes(kw)) { const f=CATS.find(([,n])=>n===cat); return {e:f?.[0]||'💰',c:cat}; } }
  }
  return {e:'💰',c:'Otros'};
}

// ── State ─────────────────────────────────────────────────────
let gastos=[], curTab='gastos', curPer='mes', editId=null, selCat=null;

function load() {
  try {
    const raw=localStorage.getItem(KEY);
    if(raw){
      gastos=JSON.parse(raw);
      const cut=new Date(); cut.setMonth(cut.getMonth()-3);
      gastos=gastos.filter(g=>new Date(g.fi)>=cut);
      lsave();
    }
  } catch(e){gastos=[];}
}
function lsave(){localStorage.setItem(KEY,JSON.stringify(gastos));}

// ── Toast ─────────────────────────────────────────────────────
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── Filter ────────────────────────────────────────────────────
function filtrar(p){
  const now=new Date(), hoy=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return gastos.filter(g=>{
    const f=new Date(g.fi);
    if(p==='hoy') return f>=hoy;
    if(p==='semana') return f>=new Date(+hoy-7*864e5);
    if(p==='mes') return f.getMonth()===now.getMonth()&&f.getFullYear()===now.getFullYear();
    if(p==='mes_ant'){const m=new Date(now.getFullYear(),now.getMonth()-1,1);return f.getMonth()===m.getMonth()&&f.getFullYear()===m.getFullYear();}
    if(p==='3meses') return f>=new Date(+hoy-90*864e5);
    return true;
  });
}

// ── Chart ─────────────────────────────────────────────────────
function chartData(arr,p){
  const b={};
  arr.forEach(g=>{
    const d=new Date(g.fi); let k;
    if(p==='hoy') k=d.getHours()+'h';
    else if(p==='semana'||p==='mes'||p==='mes_ant') k=d.getDate()+' '+MS[d.getMonth()];
    else if(p==='3meses'){const w=new Date(d);w.setDate(d.getDate()-d.getDay());k=w.getDate()+' '+MS[w.getMonth()];}
    else k=MS[d.getMonth()];
    b[k]=parseFloat(((b[k]||0)+g.monto).toFixed(2));
  });
  return Object.entries(b).map(([l,v])=>({l,v}));
}

function drawChart(data){
  const wrap=document.getElementById('chart-wrap');
  const svg=document.getElementById('chart-svg');
  if(data.length<2){wrap.style.display='none';return;}
  wrap.style.display='block';
  const W=svg.clientWidth||300, H=90;
  const pad={t:6,r:4,b:22,l:4};
  const max=Math.max(...data.map(d=>d.v),1);
  const bw=Math.max(5,(W-pad.l-pad.r)/data.length*0.55);
  const gap=(W-pad.l-pad.r)/data.length;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=data.map((d,i)=>{
    const bh=Math.max(3,(d.v/max)*(H-pad.t-pad.b));
    const x=pad.l+i*gap+gap/2-bw/2;
    const y=H-pad.b-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#d4a84b" rx="3"/>
            <text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="7" fill="#333" font-family="-apple-system,sans-serif">${d.l}</text>`;
  }).join('');
}

// ── Tabs ──────────────────────────────────────────────────────
function setTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['gastos','resumen'][i]===t));
  document.getElementById('t-gastos').style.display=t==='gastos'?'':'none';
  document.getElementById('t-resumen').style.display=t==='resumen'?'':'none';
  if(t==='resumen'){renderPeriods();renderResumen();}
}

// ── Chips ─────────────────────────────────────────────────────
function renderChips(){
  const txt=document.getElementById('i-desc').value.trim();
  const c=document.getElementById('chips');
  if(!txt){c.innerHTML='';return;}
  const g=guesscat(txt);
  if(!selCat) selCat=g.c;
  c.innerHTML=CATS.map(([em,n])=>`<button class="chip${selCat===n?' on':''}" onclick="pickCat('${n}')">${em} ${n}</button>`).join('');
}
function pickCat(n){selCat=n;renderChips();}

// ── Add ───────────────────────────────────────────────────────
function agregar(){
  const d=document.getElementById('i-desc').value.trim();
  const m=parseFloat(document.getElementById('i-monto').value);
  if(!d||!m||m<=0){toast('⚠️ Escribe qué gastaste y el monto');return;}
  let cat,em;
  if(selCat){cat=selCat;em=CATS.find(([,n])=>n===selCat)?.[0]||'💰';}
  else{const g=guesscat(d);cat=g.c;em=g.e;}
  const ts=new Date();
  gastos.unshift({id:Date.now(),descripcion:d,monto:parseFloat(m.toFixed(2)),categoria:cat,emoji:em,
    fd:ts.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}),fi:ts.toISOString()});
  lsave(); render();
  document.getElementById('i-desc').value='';
  document.getElementById('i-monto').value='';
  document.getElementById('chips').innerHTML='';
  selCat=null;
  toast('✓ Gasto registrado');
}

// ── Delete ────────────────────────────────────────────────────
function del(id){gastos=gastos.filter(g=>g.id!==id);lsave();render();toast('Eliminado');}
function borrarTodo(){
  if(!gastos.length)return;
  if(!confirm('¿Borrar todos los gastos registrados?'))return;
  gastos=[];lsave();render();toast('Todo borrado');
}

// ── Edit ──────────────────────────────────────────────────────
function startEdit(id){editId=id;render();}
function cancelEdit(){editId=null;render();}
function pickEditCat(n,em,id){
  document.querySelectorAll('[data-ec]').forEach(b=>{
    b.classList.toggle('on',b.dataset.ec===n);
  });
  document.getElementById('ed-ec').value=n;
  document.getElementById('ed-ee').value=em;
}
function guardarEdit(id){
  const d=document.getElementById('ed-desc').value.trim();
  const m=parseFloat(document.getElementById('ed-monto').value);
  const c=document.getElementById('ed-ec').value;
  const e=document.getElementById('ed-ee').value;
  if(!d||!m||m<=0){toast('⚠️ Datos inválidos');return;}
  gastos=gastos.map(g=>g.id===id?{...g,descripcion:d,monto:parseFloat(m.toFixed(2)),categoria:c,emoji:e}:g);
  editId=null;lsave();render();toast('✓ Guardado');
}

// ── Render ────────────────────────────────────────────────────
function render(){
  // Header mes
  const now=new Date();
  document.getElementById('mes-lbl').textContent=MFL[now.getMonth()]+' '+now.getFullYear();
  // Stats gastos
  const mes=filtrar('mes');
  document.getElementById('st-mes').textContent='S/ '+mes.reduce((s,g)=>s+g.monto,0).toFixed(2);
  document.getElementById('st-n').textContent=gastos.length;
  // Hist
  const h=document.getElementById('hist');
  if(!gastos.length){h.innerHTML='<div class="empty">Registra tu primer gasto arriba ↑<br>La app sugiere la categoría sola.</div>';return;}
  h.innerHTML=gastos.map((g,i)=>{
    if(editId===g.id){
      const catBtns=CATS.map(([em,n])=>`<button class="chip${g.categoria===n?' on':''}" data-ec="${n}" onclick="pickEditCat('${n}','${em}',${g.id})">${em} ${n}</button>`).join('');
      return `<div class="edit-box">
        <div class="edit-lbl">Editando registro</div>
        <div class="edit-row">
          <input id="ed-desc" style="flex:1;min-width:0;font-size:13px" value="${g.descripcion.replace(/"/g,'&quot;')}" placeholder="Descripción"/>
          <input id="ed-monto" style="width:85px;flex-shrink:0;font-size:13px;font-variant-numeric:tabular-nums" type="number" value="${g.monto}" step="0.01" min="0" inputmode="decimal"/>
        </div>
        <input type="hidden" id="ed-ec" value="${g.categoria}"/>
        <input type="hidden" id="ed-ee" value="${g.emoji}"/>
        <div class="edit-cats">${catBtns}</div>
        <div class="edit-actions">
          <button class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
          <button class="btn-save" onclick="guardarEdit(${g.id})">Guardar</button>
        </div>
      </div>`;
    }
    return `<div class="gasto">
      <span class="g-ico">${g.emoji}</span>
      <div class="g-info">
        <div class="g-desc">${g.descripcion}</div>
        <div class="g-meta">${g.categoria} · ${g.fd}</div>
      </div>
      <span class="g-amt">S/ ${g.monto.toFixed(2)}</span>
      <button class="btn-i" onclick="startEdit(${g.id})">✏️</button>
      <button class="btn-i" onclick="del(${g.id})">✕</button>
    </div>`;
  }).join('');
  if(curTab==='resumen'){renderPeriods();renderResumen();}
}

function renderPeriods(){
  document.getElementById('periods').innerHTML=PERIODOS.map(p=>
    `<button class="per${curPer===p.k?' on':''}" onclick="setPer('${p.k}')">${p.l}</button>`
  ).join('');
}
function setPer(p){curPer=p;renderPeriods();renderResumen();}

function renderResumen(){
  const gr=filtrar(curPer);
  const tot=gr.reduce((s,g)=>s+g.monto,0);
  document.getElementById('r-tot').textContent='S/ '+tot.toFixed(2);
  document.getElementById('r-n').textContent=gr.length;
  // Chart
  const cd=chartData(gr,curPer);
  setTimeout(()=>drawChart(cd),50);
  // By cat
  const bc={};
  gr.forEach(g=>{if(!bc[g.categoria])bc[g.categoria]={m:0,e:g.emoji};bc[g.categoria].m+=g.monto;});
  const cats=Object.entries(bc).sort((a,b)=>b[1].m-a[1].m);
  const maxC=cats.length?cats[0][1].m:1;
  const bd=document.getElementById('cat-bd');
  if(!cats.length){bd.innerHTML='<div class="empty" style="padding:10px 0">Sin gastos en este período</div>';return;}
  bd.innerHTML=cats.map(([cat,d])=>`
    <div class="cat-item">
      <span style="font-size:14px;width:20px;text-align:center;flex-shrink:0">${d.e}</span>
      <span class="cat-n">${cat}</span>
      <div class="bar-bg"><div class="bar-f" style="width:${(d.m/maxC*100).toFixed(0)}%"></div></div>
      <div class="cat-nums">
        <span class="cat-s">S/ ${d.m.toFixed(2)}</span>
        <span class="cat-p">${tot>0?(d.m/tot*100).toFixed(0):0}%</span>
      </div>
    </div>`).join('');
}

// ── Init ──────────────────────────────────────────────────────
load();
render();

document.getElementById('i-desc').addEventListener('input',()=>{selCat=null;renderChips();});
document.getElementById('i-desc').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('i-monto').focus();});
document.getElementById('i-monto').addEventListener('keydown',e=>{if(e.key==='Enter')agregar();});
document.getElementById('btn-add').addEventListener('click',agregar);

window.addEventListener('focus',()=>{
  const cut=new Date();cut.setMonth(cut.getMonth()-3);
  const n=gastos.filter(g=>new Date(g.fi)>=cut).length;
  if(n!==gastos.length){gastos=gastos.filter(g=>new Date(g.fi)>=new Date(cut));lsave();render();}
});
</script>
